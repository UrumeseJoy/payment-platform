spring:
  application:
    name: payment-orchestration-platform

  datasource:
    url: jdbc:postgresql://localhost:5432/payment_platform
    username: postgres
    password: password

  jpa:
    hibernate:
      # Flyway owns the schema — Hibernate must never auto-generate DDL.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: payment-orchestration
      auto-offset-reset: earliest
    producer:
      acks: all

springdoc:
  swagger-ui:
    path: /swagger-ui.html

server:
  port: 8080
